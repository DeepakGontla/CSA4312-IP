<!DOCTYPE html>
<html>
<head>
    <title>Indian Flag Background</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Indian flag background */
            background: linear-gradient(
                to bottom,
                /*#FF9933 0%,*/
                #FF9933 33.33%,
               /* white 33.33%,*/
                white 66.66%,
               /* #138808 66.66%,*/
                #138808 100%
            );

            text-align: center;
        }

        .container {
            padding: 30px;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 2px solid black;
            padding: 12px 25px;
        }

        th {
            background-color: #FF9933;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Indian Flag Theme</h1>

        <!-- Table -->
        <table>
            <tr>
                <th>Name</th>
                <th>City</th>
                <th>Country</th>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>Chennai</td>
                <td>India</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>Delhi</td>
                <td>India</td>
            </tr>

            <tr>
                <td>Arun</td>
                <td>Mumbai</td>
                <td>India</td>
            </tr>
        </table>

    </div>

</body>
</html>
