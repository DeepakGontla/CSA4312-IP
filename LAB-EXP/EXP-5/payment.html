<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book Ticket - SkyReserve</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        ✈️ Sky<span>Reserve</span>
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="search-flight.html">Flights</a>

        <a href="my-ticket.html">My Ticket</a>

    </nav>

</header>


<section class="page-header">

    <p>RESERVATION</p>

    <h1>Book Your Flight</h1>

    <span>
        Enter passenger information and select your seat.
    </span>

</section>


<section class="booking-container">


    <div class="booking-main">


        <div class="booking-card">

            <h2>✈️ Selected Flight</h2>

            <div id="selectedFlight"
                class="selected-flight">
            </div>

        </div>


        <div class="booking-card">

            <h2>👤 Passenger Details</h2>

            <form onsubmit="proceedToPayment(event)">

                <div class="form-row">

                    <div class="input-group">

                        <label>
                            Passenger Name
                        </label>

                        <input
                            type="text"
                            id="passengerName"
                            placeholder="Full name"
                            required>

                    </div>

                    <div class="input-group">

                        <label>
                            Age
                        </label>

                        <input
                            type="number"
                            id="passengerAge"
                            min="1"
                            max="120"
                            required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label>
                            Gender
                        </label>

                        <select id="passengerGender"
                            required>

                            <option value="">
                                Select gender
                            </option>

                            <option>
                                Male
                            </option>

                            <option>
                                Female
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="input-group">

                        <label>
                            Passport / ID
                        </label>

                        <input
                            type="text"
                            id="passport"
                            placeholder="Passport or ID number"
                            required>

                    </div>

                </div>


                <h3 class="sub-heading">
                    Select Your Seat
                </h3>


                <div class="seat-grid">

                    <button type="button"
                        class="flight-seat available">
                        1A
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        1B
                    </button>

                    <button type="button"
                        class="flight-seat occupied">
                        1C
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        1D
                    </button>


                    <button type="button"
                        class="flight-seat available">
                        2A
                    </button>

                    <button type="button"
                        class="flight-seat occupied">
                        2B
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        2C
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        2D
                    </button>


                    <button type="button"
                        class="flight-seat available">
                        3A
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        3B
                    </button>

                    <button type="button"
                        class="flight-seat available">
                        3C
                    </button>

                    <button type="button"
                        class="flight-seat occupied">
                        3D
                    </button>

                </div>


                <div class="seat-legend">

                    <span>
                        <i class="legend available"></i>
                        Available
                    </span>

                    <span>
                        <i class="legend selected"></i>
                        Selected
                    </span>

                    <span>
                        <i class="legend occupied"></i>
                        Occupied
                    </span>

                </div>


                <button class="primary-btn">

                    Continue to Payment →

                </button>

            </form>

        </div>

    </div>


    <aside class="fare-card">

        <h2>Fare Summary</h2>

        <div class="fare-row">

            <span>Base Fare</span>

            <strong id="baseFare">
                ₹4,299
            </strong>

        </div>

        <div class="fare-row">

            <span>Taxes & Fees</span>

            <strong>
                ₹650
            </strong>

        </div>

        <div class="fare-row">

            <span>Service Fee</span>

            <strong>
                ₹100
            </strong>

        </div>

        <hr>

        <div class="fare-total">

            <span>Total</span>

            <strong id="bookingTotal">
                ₹5,049
            </strong>

        </div>

    </aside>

</section>


<script src="js/app.js"></script>

<script>
    loadSelectedFlight();
    setupFlightSeats();
</script>

</body>
</html>
