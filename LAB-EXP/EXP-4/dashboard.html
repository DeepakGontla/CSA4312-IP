<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - RailConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🚆 Rail<span>Connect</span>
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="trains.html">
            Search Trains
        </a>

        <a href="pnr.html">
            PNR Status
        </a>

        <a href="login.html">
            Logout
        </a>

    </nav>

</header>

<section class="dashboard-header">

    <div>

        <p>PASSENGER DASHBOARD</p>

        <h1>Welcome, Passenger 👋</h1>

        <span>
            Manage your railway reservations and tickets.
        </span>

    </div>

    <a href="trains.html" class="primary-btn">
        + Book New Ticket
    </a>

</section>

<section class="dashboard-container">

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-icon blue">🎟️</div>
            <div>
                <span>Total Bookings</span>
                <strong id="totalBookings">0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">✓</div>
            <div>
                <span>Confirmed</span>
                <strong id="confirmedBookings">0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">⏳</div>
            <div>
                <span>Pending</span>
                <strong>0</strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon purple">₹</div>
            <div>
                <span>Total Spent</span>
                <strong id="totalSpent">₹0</strong>
            </div>
        </div>

    </div>

    <div class="dashboard-card">

        <div class="card-heading">

            <div>
                <h2>Booking History</h2>
                <p>Your recent railway reservations</p>
            </div>

            <a href="pnr.html">
                Check PNR
            </a>

        </div>

        <div id="bookingHistory"></div>

    </div>

</section>

<script src="js/app.js"></script>

<script>
    loadDashboard();
</script>

</body>
</html>
