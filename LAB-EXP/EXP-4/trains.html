<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Trains - RailConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🚆 Rail<span>Connect</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="trains.html" class="active">Search Trains</a>
        <a href="pnr.html">PNR Status</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

</header>

<section class="page-header">

    <p>TRAIN RESERVATION</p>

    <h1>Available Trains</h1>

    <span>
        Select a train and continue your reservation.
    </span>

</section>

<section class="train-section">

    <div class="search-summary">

        <div>
            <small>FROM</small>
            <strong id="displayFrom">Chennai</strong>
        </div>

        <div class="route-line">→</div>

        <div>
            <small>TO</small>
            <strong id="displayTo">Bangalore</strong>
        </div>

        <div>
            <small>DATE</small>
            <strong id="displayDate">28 Oct 2026</strong>
        </div>

    </div>

    <div id="trainList"></div>

</section>

<script src="js/app.js"></script>

<script>
    loadTrains();
</script>

</body>
</html>
